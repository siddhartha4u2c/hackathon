services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-partspilot}
      POSTGRES_USER: ${POSTGRES_USER:-partspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-partspilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-partspilot}
      LLMAAS_BASE_URL: ${LLMAAS_BASE_URL:-}
      LLMAAS_API_KEY: ${LLMAAS_API_KEY:-}
      LLMAAS_MODEL: ${LLMAAS_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
